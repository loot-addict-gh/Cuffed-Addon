modLoader="javafml"
loaderVersion="[47,)"
license="GPL-3.0-only"

displayURL="https://github.com/loot-addict-gh/Cuffed-Addon"
issueTrackerURL="https://github.com/loot-addict-gh/Cuffed-Addon/issues"

[[mixins]]
    config="mixins.cuffedaddon.json"

# Declared here as well as in build.gradle's jar manifest. Forge reads mixin
# configs from both, and Mixin ignores a config it has already registered, so
# listing it twice is harmless - while listing it in only the manifest meant a
# single missing line in a build file silently disabled the whole Fake Players
# feature with no error anywhere, which is what happened at 1.5.0. The
# build.gradle MixinConfigs entry can now be removed or left alone; either works.
[[mixins]]
    config="mixins.cuffedaddon.fakeplayer.json"

[[mods]]
modId="cuffedaddon"
version="1.6.4"
displayName="Cuffed Addon"
authors="loot_addict"
credits='''Built on Cuffed by LazrProductions, used under GPL-3.0 - https://github.com/LazrProductions/cuffed
Includes modified Cuffed code and artwork; the changed files are listed in README.md.
Optional integrations: Curios API (TheIllusiveC4) and Fake Players (duzo).
Some textures are modified from Minecraft's own assets. Not an official Minecraft product; not approved by or associated with Mojang or Microsoft.'''
description='''Multiple additions to the original mod. Rope, sleep mask, bed restraint, resource packs, and more!'''

